version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-platform-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/booking_platform?schema=public
      - JWT_SECRET=your_super_secret_jwt_key_here
      - JWT_EXPIRES_IN=1d
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: booking-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: